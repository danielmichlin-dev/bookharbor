name: BookHarbor
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  BookHarbor:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.bookharbor
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: BookHarbor
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Connect to your audiobook server on your home network.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    scheme:
      testTargets: [BookHarborTests]
  BookHarborTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BookHarbor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
